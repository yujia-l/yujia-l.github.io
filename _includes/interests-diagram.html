<div class="interests-diagram" id="interests-diagram">
  <svg class="interests-diagram__svg" viewBox="0 0 613 300" role="img" aria-label="Research interests: Fabrication, Human-AI Interaction, and Education">
    <defs>
      <filter id="interests-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g class="interests-zones">
      <image class="interests-zone interests-zone__blob" data-zone="fabrication" href="{{ '/images/blue.png' | relative_url }}" x="138" y="0" width="212" height="190" />
      <image class="interests-zone interests-zone__blob" data-zone="human-ai" href="{{ '/images/yellow.png' | relative_url }}" x="292" y="0" width="205" height="207" />
      <image class="interests-zone interests-zone__blob" data-zone="education" href="{{ '/images/pink.png' | relative_url }}" x="198" y="100" width="206" height="170" />
    </g>

    <g class="interests-lines">
      <line class="interests-line" data-project="accessible-mobility" x1="100" y1="35" x2="180" y2="55" />
      <line class="interests-line" data-project="xstrings" x1="50" y1="115" x2="165" y2="90" />
      <line class="interests-line" data-project="flexeop" x1="57" y1="180" x2="180" y2="140" />
      <line class="interests-line" data-project="more-than-shapes" x1="90" y1="230" x2="275" y2="145" />
      <line class="interests-line" data-project="mindshift" x1="550" y1="30" x2="435" y2="40" />
      <line class="interests-line" data-project="keyflow" x1="535" y1="100" x2="460" y2="122" />
      <line class="interests-line" data-project="bricksmart" x1="530" y1="175" x2="360" y2="155" />
      <line class="interests-line" data-project="mentigo" x1="550" y1="240" x2="365" y2="175" />
    </g>

    <g class="interests-dots">
      <circle class="interests-dot" data-project="accessible-mobility" cx="180" cy="55" r="4.5" />
      <circle class="interests-dot" data-project="xstrings" cx="165" cy="90" r="4.5" />
      <circle class="interests-dot" data-project="flexeop" cx="180" cy="140" r="4.5" />
      <circle class="interests-dot" data-project="more-than-shapes" cx="275" cy="145" r="4.5" />
      <circle class="interests-dot" data-project="mindshift" cx="435" cy="40" r="4.5" />
      <circle class="interests-dot" data-project="keyflow" cx="460" cy="122" r="4.5" />
      <circle class="interests-dot" data-project="bricksmart" cx="360" cy="155" r="4.5" />
      <circle class="interests-dot" data-project="mentigo" cx="365" cy="175" r="4.5" />
    </g>

    <g class="interests-labels">
      <g class="interests-zone-label" data-zone="fabrication" transform="translate(240 72)">
        <image class="interests-zone-icon" href="{{ '/images/printing-icon.png' | relative_url }}" x="-22" y="-22" width="44" height="44" />
        <text class="interests-zone-name" y="30" text-anchor="middle">Fabrication</text>
      </g>

      <g class="interests-zone-label" data-zone="human-ai" transform="translate(408 72)">
        <image class="interests-zone-icon" href="{{ '/images/ai-icon.png' | relative_url }}" x="-22" y="-22" width="44" height="44" />
        <text class="interests-zone-name" y="26" text-anchor="middle">
          <tspan x="0" dy="0">Human-AI</tspan>
          <tspan x="0" dy="1.15em">Interaction</tspan>
        </text>
      </g>

      <g class="interests-zone-label" data-zone="education" transform="translate(300 200)">
        <image class="interests-zone-icon" href="{{ '/images/reading-icon.png' | relative_url }}" x="-22" y="-22" width="44" height="44" />
        <text class="interests-zone-name" y="30" text-anchor="middle">Education</text>
      </g>
    </g>
  </svg>

    <a class="interests-project interests-project--left interests-project--chi" data-project="accessible-mobility" data-zones="fabrication" href="https://yujia-l.github.io/pdfs/Exoskeleton.pdf" target="_blank" rel="noopener">

    <a class="interests-project interests-project--left interests-project--chi" data-project="xstrings" data-zones="fabrication" href="https://dl.acm.org/doi/10.1145/3706598.3714282" target="_blank" rel="noopener">

      <span class="interests-project__title">More Than Shapes</span>

      <span class="interests-project__title">MindShift</span>
      <span class="interests-project__venue">CHI'24</span>

    <a class="interests-project interests-project--right" data-project="keyflow" data-zones="human-ai" href="https://dl.acm.org/doi/10.1145/3672539.3686348" target="_blank" rel="noopener">
      <span class="interests-project__title">KeyFlow</span>
      <span class="interests-project__venue">UIST'24 Poster</span>
    </a>
    <a class="interests-project interests-project--right interests-project--chi" data-project="bricksmart" data-zones="human-ai education" href="https://dl.acm.org/doi/10.1145/3706598.3714212" target="_blank" rel="noopener">
      <span class="interests-project__title">BrickSmart</span>
      <span class="interests-project__venue">CHI'25</span>
    </a>
    <a class="interests-project interests-project--right interests-project--chi" data-project="mentigo" data-zones="human-ai education" href="https://dl.acm.org/doi/10.1145/3706598.3713952" target="_blank" rel="noopener">
