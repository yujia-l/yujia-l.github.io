<span class="section-icon{% if include.small %} section-icon--sm{% endif %}" aria-hidden="true">

      <circle cx="12" cy="8" r="3.5" />

      <rect x="4" y="4" width="7" height="7" rx="1" />

      <circle cx="12" cy="12" r="2.25" />
